      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4 # Moffstation - Increase Markings
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4 # Moffstation - Increase Markings
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4 # Moffstation - Increase Markings
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4 # Moffstation - Increase Markings
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4 # Moffstation - Increase Markings
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1 # Moffstation - :3
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  categories: [ HideSpawnMenu ]
  name: ipc appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganIPCTorso
      Head: OrganIPCHead
      ArmLeft: OrganIPCArmLeft
      ArmRight: OrganIPCArmRight
      HandRight: OrganIPCHandRight
      HandLeft: OrganIPCHandLeft
      LegLeft: OrganIPCLegLeft
      LegRight: OrganIPCLegRight
      FootLeft: OrganIPCFootLeft
      FootRight: OrganIPCFootRight
      Brain: OrganIPCBrain
      Eyes: OrganIPCEyes
      Tongue: OrganIPCTongue
      Appendix: OrganIPCAppendix
      Ears: OrganIPCEars
      Lungs: OrganIPCLungs
      Heart: OrganIPCHeart
      Stomach: OrganIPCStomach
      Liver: OrganIPCLiver
      Kidneys: OrganIPCKidneys
  - type: HumanoidProfile
    species: IPC

- type: entity
  parent:
  - AppearanceIPC
  - BaseSpeciesMobOrganic
  id: MobIPC
  name: Urist McPositronic
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganIPC
  abstract: true
  suffix: IPC

- type: entity
  id: OrganIPCMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ IPC ]

- type: entity
  parent: OrganIPC
  id: OrganIPCInternal
  abstract: true
  components:
